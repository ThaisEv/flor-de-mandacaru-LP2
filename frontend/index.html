<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor de Mandacaru</title>
  <meta name="description" content="Flores que carregam a beleza da nossa terra.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="hero">
    <header class="header" aria-label="Navegação principal">
      <a class="brand" href="./index.html" aria-label="Flor de Mandacaru - início">
        <img src="./assets/logo.svg" alt="Flor de Mandacaru">
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="main-nav" aria-label="Categorias">
        <a class="active" href="./index.html">Início</a>
        <a href="#flores">Flores</a>
        <a href="#buques">Buquês</a>
        <a href="#plantas">Plantas</a>
        <a href="#presentes">Presentes</a>
        <a href="#contato">Contato</a>
      </nav>

      <div class="header-actions">
        <button class="search-button" type="button" aria-label="Pesquisar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16l4 4"></path>
          </svg>
        </button>
        <button class="action-button" type="button" aria-label="Favoritos">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.7a5.5 5.5 0 00-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1.1L12 21l7.8-7.4 1.1-1.1a5.5 5.5 0 000-7.8z"></path>
          </svg>
        </button>
        <button class="cart-button" type="button" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h2l2.2 10.2h10.6l2-7H6"></path>
            <circle cx="9" cy="19" r="1.2"></circle>
            <circle cx="17" cy="19" r="1.2"></circle>
          </svg>
        </button>
      </div>
    </header>

    <section class="banner" aria-label="Coleção de flores">
      <div class="banner-overlay"></div>
      <div class="banner-content">
        <h1>Flores que carregam a<br>beleza da nossa terra</h1>
        <a class="catalog-button" href="#catalogo">
          <span>Catálogo</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5l7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <div class="search-panel" aria-hidden="true">
    <label for="search-input">O que você procura?</label>
    <div class="search-field">
      <input id="search-input" type="search" placeholder="Buscar flores, buquês...">
      <button type="button" aria-label="Fechar pesquisa">×</button>
    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
